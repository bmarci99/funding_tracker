[project]
name = "funding-tracker"
version = "0.1.0"
description = "Weekly digest of open Horizon Europe funding opportunities, delivered by email"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
funding-tracker = "funding_tracker.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funding_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
