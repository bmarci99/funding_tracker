# ---------------------------------------------------------------------------
# AI analyst (OpenAI). Reads every roadmap match and every foundation call against the company
# brief below and answers: can we apply, with what project, which entity, which partners, risks,
# next step. Needs OPENAI_API_KEY (repo secret in CI). Cached per call in outputs/ai_cache.json.
# ---------------------------------------------------------------------------
ai:
  enabled: true
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  max_concurrent: 4
  max_call_chars: 3500
  max_items: 300                   # safety cap per run
  max_eur_per_run: 5.0             # HARD budget: real token usage is priced per response; the run stops at this
  analyse_all_foundations: true    # foundations are thin on keywords → let the model judge them all
  min_fit_for_portal: 35           # portal topics: only those already matching the roadmap
  pick_min_score: 60               # ai_score needed for the "AI picks" section
  cache: "outputs/ai_cache.json"

