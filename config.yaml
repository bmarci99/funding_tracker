             "wearables", "roboter", "künstliche intelligenz", "mesterséges intelligencia", "sprachassistent", "gesichtsausdruck", "emotionserkennung", "empathie", "empátia"]
      context: ["robot", "robots", "roboter", "actuator", "actuators", "sensor", "sensors", "speech", "computer vision",
                "perception", "interaction", "ai", "artificial intelligence", "machine learning", "3d printing",
