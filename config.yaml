    # EuroHPC JU: site blocks scripts (403); its calls are on the F&T portal anyway (HORIZON-EUROHPC-JU-…)

# ---------------------------------------------------------------------------
# Relevance: keyword packs per company (from PBN Tender Radar) + HORIZONS interests.
# Score = 3×strong + 1.5×medium + 0.5×soft (each capped at 3 distinct hits) − 5×negative.
# ---------------------------------------------------------------------------
relevance:
  threshold: 4.5          # needs a real strong hit plus something else
  # Terms that are ubiquitous in EU call texts (they were written for tender notices):
  # always counted at soft weight (0.5) whatever tier they sit in, so they can't carry a match alone.
  demote: ["ecosystem", "consortium", "policy", "training", "pilot", "widening", "leadership", "sme", "kkv", "kmu",
           "horizon europe", "digital europe", "eic", "demonstrator", "mentoring", "accessibility", "automation",
           "artificial intelligence", "machine learning", "future of work", "change management", "energy efficiency",
           "circular economy", "data analytics", "technology transfer", "elderly", "ageing", "robotics"]
  interests:              # regexes ported from HORIZONS category insights; count as strong hits
    - label: "Humanoid / Social Robotics"
      pattern: "humanoid|social robot|socially assistive|human-robot interaction|\\bhri\\b"
    - label: "Core Space"
      pattern: "HORIZON-[A-Z0-9-]*SPACE"
  companies:
    pbn:
      name: "Pannon Business Network"
      keywords:
        strong: ["digital innovation hub", "european digital innovation hub", "edih", "ecosystem", "ökoszisztéma", "ökosystem",
                 "interreg", "widening", "esa", "european space agency", "hungarian space agency", "magyar űrügynökség", "hunor",
                 "space programme", "űrprogram", "consortium", "konzorcium", "konsortium", "szombathely2030", "szombathely 2030",
                 "intelligent city challenge", "100 intelligent cities", "interreg europe", "european health industry test reference",
                 "vasi kamara", "vas megye"]
        medium: ["sme", "kkv", "kmu", "technology transfer", "technológia transzfer", "technologietransfer", "policy", "politika"]
        soft: ["training", "képzés", "weiterbildung", "mentoring", "mentorálás", "pilot", "demonstrator", "demonstrátor",
               "space ecosystem", "űripari ökoszisztéma"]
        negative: ["defence", "military", "verteidigung", "katonai", "gambling", "szerencsejáték", "glücksspiel"]
    amlab:
      name: "am-LAB — Factory of the Future"
      keywords:
        strong: ["humanoid", "social robot", "cobot", "collaborative robot", "kollaboratív", "human-robot interaction", "hri",
                 "robotika", "space robotics", "astronaut support", "crew support", "industry 4.0", "industry 5.0", "operator 5.0",
                 "industrie 4.0", "smart factory", "intelligens gyár", "digital twin", "digitális iker", "digitaler zwilling",
                 "additive manufacturing", "3d printing", "additív gyártás"]
        medium: ["artificial intelligence", "mesterséges intelligencia", "künstliche intelligenz", "machine learning", "gépi tanulás",
                 "maschinelles lernen", "predictive maintenance", "prediktív karbantartás", "augmented reality", "virtual reality",
                 "kiterjesztett valóság", "erweiterte realität", "circular economy", "körforgásos gazdaság", "kreislaufwirtschaft",
                 "energy efficiency", "energiahatékonyság", "energieeffizienz", "cleanroom", "clean room", "tisztatér", "microbiome",
                 "mikrobiom", "astronaut", "űrhajós", "space life science", "bioastronautics"]
        soft: ["automation", "automatizálás", "automatisierung", "computer vision", "data analytics", "adatelemzés", "datenanalyse",
               "space technology", "űrtechnológia", "esa", "ros", "ros 2", "openvla", "rt-2", "physical intelligence",
               "manipulation policy", "hpc", "high performance computing", "hlrs"]
        negative: ["defence", "military", "verteidigung", "katonai"]
    athome:
      name: "at.home — Elderly Digitalisation"
      keywords:
        strong: ["active and assisted living", "ambient assisted living", "aal", "telecare", "telebetreuung", "telerehab",
                 "idősellátás", "időskori", "ezüst gazdaság", "silver economy", "astronaut health", "crew health", "space medicine",
                 "complex rehabilitation", "komplex rehabilitáció", "stroke rehabilitation", "stroke rehabilitáció",
                 "musculoskeletal rehabilitation", "mozgásszervi rehabilitáció", "vr rehabilitation", "rehabilitation engineering",
                 "european health industry test reference", "szombathely2030", "szombathely 2030"]
        medium: ["elderly", "senior care", "ageing", "altern", "accessibility", "akadálymentesítés", "barrierefreiheit", "ehealth",
                 "telemedicine", "telemedicina", "microbiome", "mikrobiom", "cleanroom", "tisztatér"]
        soft: ["rehabilitation", "rehabilitáció", "space life science", "bioastronautics"]
        negative: ["defence", "military"]
    pbn_germany:
      name: "PBN Germany GmbH — Humanoid Test Center"
      keywords:
        strong: ["humanoid", "human-humanoid", "human-robot interaction", "mensch-roboter", "mensch-humanoid", "social robot", "hri",
                 "space hri", "astronaut support", "crew support", "behavioural analysis", "verhaltensanalyse", "nrw",
                 "north rhine-westphalia", "nordrhein-westfalen", "ki.nrw", "efre.nrw", "nrw.bank", "mittelstand-digital",
                 "mittelstand 4.0", "mittelstand innovativ", "ai maturity", "ki-reifegrad", "workforce shortage", "fachkräftemangel",
                 "fachkraeftemangel", "human-centric ai", "menschzentrierte ki", "vision-language-action", "vla", "isaac gr00t",
                 "foundation model for robotics", "hlrs", "höchstleistungsrechenzentrum", "hoechstleistungsrechenzentrum",
                 "gauss centre for supercomputing", "gcs supercomputing", "eurohpc", "ai factory", "ki-fabrik"]
        medium: ["stuttgart", "baden-württemberg", "baden-wuerttemberg", "zim", "bmbf", "bmwk", "kmu-innovativ", "eurostars", "eic",
                 "horizon europe", "digital europe", "esa", "european space agency", "space programme", "space robotics", "astronaut",
                 "data analytics", "datenanalyse", "interaction design", "interaktionsdesign", "düsseldorf", "duesseldorf", "köln",
                 "koeln", "aachen", "dortmund", "essen", "bonn", "survey methodology", "likert", "sme survey", "kmu-befragung",
                 "operational resilience", "resilienzmessung", "operational flexibility", "operative flexibilität",
                 "production variability", "produktionsvariabilität", "demographic change", "demografischer wandel",
                 "zukunft der arbeit", "future of work", "change management", "leadership", "führung", "employee acceptance",
                 "mitarbeiterakzeptanz", "inqa", "hans-böckler", "hans-boeckler"]
        soft: ["robotics", "robotik", "mittelstand", "kmu"]
        negative: ["verteidigung", "military", "defence", "glücksspiel"]

# ---------------------------------------------------------------------------
filters:
  deadline_within_days: 0          # 0 = no limit
  include_keywords: []             # hard include (substring on id/title/tags); empty = keep all
  exclude_keywords: []
  only_full_rate: false            # true → keep only 100%-funded topics

digest:
  closing_soon_days: 30
  max_rows_per_section: 40         # email only; overflow links to the archive
  max_per_cluster: 0               # archive page (0 = unlimited)

history:
  rolling_days: 400
  path: "outputs/history.json"

output:
  dir: "outputs"
  archive: true
  archive_dir: "docs"
  archive_url: "https://bmarci99.github.io/funding_tracker"

email:
  send_on_empty: true
  subject_prefix: "Funding Digest"

http:
  timeout_s: 60.0
  max_retries: 3
  backoff_factor: 1.5
  user_agent: "funding-tracker/0.1 (+https://github.com/bmarci99/funding_tracker)"
