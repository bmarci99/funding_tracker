# ---------------------------------------------------------------------------
filters:
  deadline_within_days: 0          # 0 = no limit
  include_keywords: []             # hard include (substring on id/title/tags); empty = keep all
  exclude_keywords: []
  only_full_rate: true             # keep only topics that are 100 %-funded *for your entities* (foundations count as 100 %)

digest:
  language: hu                     # "en" or "hu" — headings, badges, verdicts; call titles stay in their source language
  match_min_score: 35              # fit score needed for the ⭐ section (35 Worth a look · 50 Good · 70 Strong)
  closing_soon_days: 30
  max_rows_per_section: 40         # email only; overflow links to the archive
  max_matches_per_theme: 10        # email only
  max_per_cluster: 0               # archive page (0 = unlimited)

history:
  rolling_days: 400
  path: "outputs/history.json"

output:
  dir: "outputs"
  archive: true
  archive_dir: "docs"
  archive_url: "https://bmarci99.github.io/funding_tracker"

email:
  send_on_empty: true
  subject_prefix: ""                # empty → uses the digest title in the chosen language

http:
  timeout_s: 60.0
  max_retries: 3
  backoff_factor: 1.5
  user_agent: "funding-tracker/0.1 (+https://github.com/bmarci99/funding_tracker)"
