# ---------------------------------------------------------------------------
# YOUR PROFILE — what the fit score (0–100) is measured against. See src/funding_tracker/scoring.py.
# Term tiers per theme: anchor (4) · core (2) · context (0.75). Title hits ×2, tags ×1.5, body ×1.
# A theme only fires with ≥1 anchor or ≥2 core hits. Prefix a term with "re:" for a raw regex.
# ---------------------------------------------------------------------------
profile:
  entities:                      # legal entities you can apply with → effective funding rate
    nonprofit: true              # HU non-profit now, DE gGmbH planned → IA/JU-IA count as 100 %
    sme: true                    # DE GmbH, HU for-profit → EIC Accelerator, SME-only calls
  min_grant_eur: 250000          # below this a grant barely pays for a prototype
  company_brief: |
    PBN Group (Szombathely, Hungary + Stuttgart, Germany), ~30 engineers/economists, applied R&D and
    European Digital Innovation Hub since 2006. Entities: Pannon Business Network Association (HU
    non-profit; eligible for 100% rates), PBN Germany GmbH (Stuttgart, for-profit R&D in robotics/AI/
    humanoids, HRB 799279), am-LAB (HU, Factory-of-the-Future lab, for-profit), at.home (HU, elderly
    digitalisation), a German gGmbH (non-profit) is planned. ISO 9001 + ISO 27001 certified HRI lab.
    What we build: ETHEA — a hardware-agnostic "Human–Humanoid Interaction Intelligence" platform
    (functional empathy engine, multimodal human-state estimation from speech prosody, face, posture and
    wearables; on-device; ROS 2) at TRL 6, validated in four waves with 70+ older adults on an Engineered
    Arts Ameca; and, since Sep 2026, our own expressive humanoid head "ETHEA Face" (silicone face,
    30+ FACS action units target, eye cameras, mic array, on-board compute, published ROS 2 interface),
    TRL 2–3, with a Budapest film-industry prosthetics team and HLRS (Stuttgart supercomputing) as partners.
    Roadmap priorities: (1) the humanoid head and expressive HRI; (1) social companion in healthcare,
    especially oncology, with Markusovszky University Teaching Hospital (Szombathely) as clinical partner;
    (2) teacher / learning companion; (3) companion for war veterans and trauma; (3) astronaut / space crew
    companion (ESA OSIP proposal exists). Track record: Interreg BrAIn (ETHEA software), Villum Fonden
    grant (€800k), EDIH, Szombathely2030 programme, SPRIND Next Frontier Robotics application (Oct 2026).
    We want 100%-funded grants; we can lead small consortia or join larger ones as the HRI/companion partner.
  negative: ["defence", "military", "weapon", "verteidigung", "katonai", "gambling", "glücksspiel"]
  negative_exempt_themes: ["veterans"]   # "military veterans" must not be penalised
  themes:
    humanoid_head:                 # CAPABILITY axis — what you build (ETHEA Face + ETHEA platform)
      label: "Humanoid head & expressive HRI"
      label_hu: "Humanoid fej és kifejező HRI"
      priority: 1
      capability: true
      color: "#7c3aed"
      anchor: ["humanoid", "humanoids", "android robot", "humanoid head", "robot head", "robotic head", "expressive face",
               "expressive head", "facial expression", "facial expressions", "facial action", "animatronic", "social robot",
               "social robots", "socially interactive", "socially assistive robot", "human-robot interaction", "human-humanoid",
               "re:\\bhri\\b", "companion robot", "robot companion", "embodied conversational agent", "embodied ai",
               "embodied intelligence", "affective computing", "functional empathy", "human-state estimation", "cross-embodiment",
               "humanoide roboter", "humanoider roboter", "sozialer roboter", "soziale roboter", "mensch-roboter-interaktion", "mensch-roboter", "humanoid robotok", "szociális robot", "ember-robot interakció", "sociale robotter", "menneske-robot"]
      core: ["robotics", "robotik", "robotika", "gaze", "eye contact", "emotion recognition", "emotion expression", "empathy", "empathic", "speech interaction",
             "spoken dialogue", "dialogue system", "conversational agent", "multimodal interaction",
