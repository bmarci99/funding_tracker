# ---------------------------------------------------------------------------
# Source 1: EU Funding & Tenders Portal (SEDIA search API)
# ---------------------------------------------------------------------------
portal:
  enabled: true
  api_url: "https://api.tech.ec.europa.eu/search-api/prod/rest/search"
  api_key: "SEDIA"
  programme_period: "2021 - 2027"
  # Portal frameworkProgramme IDs. Full map in src/funding_tracker/ingest/ft_portal.py.
  framework_programmes:
    - "43108390"   # HORIZON   Horizon Europe
    - "43298916"   # EURATOM
    - "43152860"   # DIGITAL   Digital Europe
    - "43252405"   # LIFE
    - "43251567"   # CEF       Connecting Europe Facility
    - "43353764"   # ERASMUS+
    - "44416173"   # I3        Interregional Innovation Investments
    - "43251589"   # CERV
    - "43252476"   # SMP       Single Market Programme
    - "45532249"   # EUBA      EU Bodies & Agencies
    - "43089234"   # INNOVFUND Innovation Fund
    - "43392145"   # EMFAF
    # - "44181033" # EDF — European Defence Fund (excluded: "defence" is a negative keyword in every pack)
  # 31094501 = Forthcoming, 31094502 = Open  (31094503 = Closed — not wanted)
  statuses:
    - "31094501"
    - "31094502"
  page_size: 100
  max_pages: 30

# ---------------------------------------------------------------------------
# Source 2: private foundations & national funders (index-page scraping)
# Ported from PBN Tender Radar (URLs re-verified 2026-09-21). No structured deadlines → they feed
# the "new" section. If a page's CSS selectors find < 3 items, the scraper falls back to collecting
# every link that looks like a call / grant / programme page.
# ---------------------------------------------------------------------------
foundations:
  enabled: true
  request_delay_s: 1.5
  max_items_per_feed: 50
  feeds:
    - name: "Villum Fonden — Open calls"
      country: "DK"
      url: "https://villumfonden.dk/en/basic-page/current-calls-0"
      item_selector: "article, .news-item, li.news"
      title_selector: "h2, h3, .title"
    - name: "Novo Nordisk Foundation — Grants & calls"
      country: "DK"
      url: "https://novonordiskfonden.dk/en/grant/"
      item_selector: "article, .card, li"
      title_selector: "h2, h3, .title"
    - name: "VolkswagenStiftung — Calls for proposals"
      country: "DE"
      url: "https://www.volkswagenstiftung.de/en/our-funding-portfolio"
      item_selector: ".funding-initiative, article"
      title_selector: "h2, h3"
    - name: "Robert Bosch Stiftung — Funding"
      country: "DE"
      url: "https://www.bosch-stiftung.de/en/funding"
      item_selector: "article, .teaser"
      title_selector: "h2, h3"
    - name: "Baden-Württemberg Stiftung — Programme"
      country: "DE"
      url: "https://www.bwstiftung.de/de/ausschreibungen"
      item_selector: ".programm, article"
      title_selector: "h2, h3"
    - name: "Daimler und Benz Stiftung — Förderung"
      country: "DE"
      url: "https://www.daimler-benz-stiftung.de/bewerbung/"
      item_selector: "article, .teaser"
      title_selector: "h2, h3"
    - name: "Carlsberg Foundation — Calls"
      country: "DK"
      url: "https://www.carlsbergfondet.dk/en/granting-unit/our-support/"
      item_selector: "article, li"
      title_selector: "h2, h3"
    - name: "NKFIH — open calls (HU)"
      country: "HU"
      url: "https://nkfih.gov.hu/palyazoknak/palyazatok"
      item_selector: "article, li, .felhivas"
      title_selector: "h2, h3, .title"
    # --- DE foundations (heavy on tech / AI / robotics) -------------------
