      title_selector: "h2, h3"
    - name: "Körber-Stiftung — News & Calls"
      country: "DE"
      url: "https://koerber-stiftung.de/"
      item_selector: "article, .teaser"
      title_selector: "h2, h3"
    - name: "Stiftung Mercator — Förderung"
      country: "DE"
