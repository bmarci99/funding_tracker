      title_selector: "h2, h3"
    - name: "Hertie-Stiftung — Förderung"
      country: "DE"
      url: "https://www.ghst.de/"
      item_selector: "article, .teaser"
      title_selector: "h2, h3"
    - name: "Fritz Thyssen Stiftung — Förderung"
      country: "DE"
